# .github/workflows/trophy.yml
name: Generate trophy

on:
  schedule:
    - cron: '0 0 * * *'   # once a day
  workflow_dispatch:        # lets you trigger it manually too

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: fadlelmula
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit trophy.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "Update trophy"
          git push
