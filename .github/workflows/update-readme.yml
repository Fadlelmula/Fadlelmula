name: Update latest repos

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh latest repos section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, os, re, urllib.request

          user = "Fadlelmula"
          req = urllib.request.Request(
              f"https://api.github.com/users/{user}/repos?sort=pushed&per_page=30&type=owner",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}"},
          )
          repos = json.load(urllib.request.urlopen(req))
          repos = [r for r in repos if not r["fork"] and r["name"] != user][:5]

          lines = []
          for r in repos:
              desc = (r["description"] or "no description yet").replace("\n", " ")
              lines.append(f"- [`{r['name']}`]({r['html_url']}) · {desc} · updated {r['pushed_at'][:10]}")
          block = "\n".join(lines) if lines else "- Nothing public yet. Stay tuned."

          text = open("README.md", encoding="utf-8").read()
          new = re.sub(
              r"(<!-- LATEST-REPOS:START -->\n).*?(\n<!-- LATEST-REPOS:END -->)",
              lambda m: m.group(1) + block + m.group(2),
              text,
              flags=re.S,
          )
          open("README.md", "w", encoding="utf-8").write(new)
          PY

      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: refresh latest repos"
            git push
          fi
